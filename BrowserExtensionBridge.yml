# Implementation Plan: InstaHMS to ClarityMDT Browser Extension Bridge

## Overview
Build a unified **Manifest V3 WebExtension** compatible with both **Firefox** and **Chrome** to bridge basic patient demographics (`ptName`, `age`, `gender`, `mrn`) from InstaHMS (`http://192.168.10.12/instahms/*`) into **ClarityMDT** without requiring an official HMS API.

The extension will support two workflows:
1. **Push from InstaHMS:** Clinician views a patient chart and clicks **"Send to ClarityMDT"** to open a pre-filled New Case form.
2. **Pull from ClarityMDT:** Clinician enters an MRN in ClarityMDT and clicks **"Fetch from HMS"** to silently retrieve and populate patient demographics in the background.

---

## Phase 1: DOM Mapping & Reconnaissance
Before writing extension code, inspect the exact HTML structure of InstaHMS (`EMRMainDisplay.do`).

* [ ] **Check for Frames/Iframes:** Open DevTools (`F12`) on `http://192.168.10.12/instahms/emr/EMRMainDisplay.do?_method=list&mr_no=SN00918543` and verify whether patient details reside in the top document or inside nested `<frame>` / `<iframe>` tags.
* [ ] **Map Field Selectors:** Record the exact CSS selectors or table cell paths for the initial MVP fields:
  * MRN (`mr_no`)
  * Patient Name (`ptName`)
  * Age (`age`)
  * Gender (`gender`)
* [ ] **Verify Direct Fetch Content:** Confirm that the `200 OK` HTML returned by `fetch('/instahms/emr/EMRMainDisplay.do?_method=list&mr_no=SN00918543')` contains the Name, Age, and Gender directly in the HTML (and check character encoding).

---

## Phase 2: ClarityMDT Receiver Setup
Create a clean, reliable handoff inside ClarityMDT (Next.js 15 / React 18) instead of manipulating React DOM inputs externally.

* [x] **Predictable DOM Hook:** ClarityMDT's New Case form (`app/cases/new/page.tsx`) already has `id="mrn"` on the MRN input so `clarity-content.js` can reliably attach the **"Fetch from HMS"** button.
* [x] **Implement `window.postMessage` Listener (Client-Side Handoff):**
  * Added a `useEffect` hook on `app/cases/new/page.tsx` listening for `CLARITY_MDT_PREFILL` messages.
  * Validates `event.source === window` and `event.origin === window.location.origin`, normalizes `gender` to Prisma `Gender` (`Male` / `Female` / `Other`), and updates `formData` cleanly.

---

## Phase 3: Cross-Browser Extension Build
Develop a single Manifest V3 codebase using `webextension-polyfill` so the exact same package runs on Firefox and Chrome.

### Project Structure
```text
clarity-hms-bridge/
├── manifest.json          # MV3 config with host permissions for 192.168.10.12 & ClarityMDT
├── background.js          # Service worker: fetches raw HTML from InstaHMS by MRN
├── hms-content.js         # Injects "Send to ClarityMDT" button on EMRMainDisplay.do
├── clarity-content.js     # Injects "Fetch from HMS" button, parses HTML, relays data via postMessage
└── parser.js              # Shared HTML parser (extracts ptName, age, gender, mrn from Document)
```

### Tasks
* [ ] **Configure `manifest.json`:**
  * Add `host_permissions` for `http://192.168.10.12/instahms/*` and your internal ClarityMDT server URL.
  * Add `storage` permission (for in-memory `storage.session` handoff during Push).
  * Set `"all_frames": true` for `hms-content.js` to handle legacy Struts `<frame>` layouts.
* [ ] **Build `parser.js`:**
  * Write pure extraction functions that accept a `Document` object (either live `document` or `new DOMParser().parseFromString(html, 'text/html')` inside `clarity-content.js` — **not** in `background.js`, since MV3 Service Workers lack `DOMParser`) and return standardized JSON:
    ```json
    {
      "mrn": "SN00918543",
      "patientName": "Patient Name",
      "age": "45",
      "gender": "Male"
    }
    ```
* [ ] **Build `background.js` (MRN Lookup Worker):**
  * Listen for `FETCH_PATIENT_BY_MRN` messages from `clarity-content.js`.
  * Execute `fetch('http://192.168.10.12/instahms/emr/EMRMainDisplay.do?_method=list&mr_no=' + encodeURIComponent(mrn), { credentials: 'include' })` and return `{ html }` (raw HTML text) back to `clarity-content.js` for parsing.
  * Handle session expiry: if `res.redirected` or the response HTML is the InstaHMS login screen, return `{ error: "NOT_LOGGED_IN" }` so ClarityMDT prompts the user to sign into HMS first.
* [ ] **Build Content Scripts (`hms-content.js` & `clarity-content.js`):**
  * **Push (`hms-content.js`):** Extract fields via `parser.js`, store temporarily in `browser.storage.session` (memory-only), and open `/cases/new?fromHms=1`. `clarity-content.js` reads and immediately deletes the `storage.session` entry, then posts `CLARITY_MDT_PREFILL` to the page.
  * **Pull (`clarity-content.js`):** Inject "Fetch from HMS" button next to `#mrn`, send `FETCH_PATIENT_BY_MRN` to `background.js`, parse returned HTML with `DOMParser` + `parser.js`, and relay JSON to ClarityMDT via `window.postMessage`.

---

## Phase 4: Security, Testing & Workstation Rollout

### Security & PHI Compliance
* [ ] **Zero Disk Persistence:** Never save scraped patient data to `storage.local`, URL query params, or console logs in production (use `storage.session` / in-memory only and clear immediately after handoff).
* [ ] **Origin Locking:** Restrict `window.postMessage` targets and listeners strictly to `window.location.origin`.

### Packaging & Internal Distribution
* [ ] **Firefox Deployment (Primary):**
  * Zip the extension and submit it as an **Unlisted Add-on** on the Mozilla Add-ons Developer Hub for free automated signing (remains private to your hospital, hidden from public search).
  * Distribute the signed `.xpi` file across hospital PCs via Firefox `policies.json` or manual installation.
* [ ] **Chrome / Edge Deployment:**
  * On domain-joined Windows PCs, deploy via Group Policy (`ExtensionInstallForcelist`) pointing to an internal server hosting the `.crx` and `updates.xml`, or load unpacked in Developer Mode on dedicated MDT workstations.

### Pilot Testing
* [ ] **Edge-Case Validation:** Test with 2–3 MDT coordinators covering edge cases:
  * Pediatric ages formatted in months/days instead of years
  * Extra whitespace or titles (Mr./Mrs./Dr.) in patient name cells
  * Expired HMS login sessions
