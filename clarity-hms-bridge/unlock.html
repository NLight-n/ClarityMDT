<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Unlock ClarityMDT Bridge</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 20px;
      color: #0f172a;
      background: #f8fafc;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 16px;
      max-width: 340px;
      margin: 0 auto;
    }
    h1 { font-size: 15px; margin: 0 0 6px 0; }
    p { font-size: 12px; color: #64748b; margin: 0 0 12px 0; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 10px;
    }
    .row { display: flex; gap: 8px; }
    button {
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      background: #0f766e;
      color: #ffffff;
    }
    button.secondary {
      background: #e2e8f0;
      color: #0f172a;
    }
    #status {
      font-size: 12px;
      color: #b91c1c;
      margin-top: 8px;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Unlock Extension Credentials</h1>
    <p>Enter your PIN to unlock saved credentials for this browser session.</p>
    <form id="unlockForm">
      <input type="password" id="pinInput" placeholder="Enter PIN" autofocus />
      <div class="row">
        <button type="submit">Unlock</button>
        <button type="button" id="openOptionsBtn" class="secondary">Settings</button>
      </div>
    </form>
    <div id="status"></div>
  </div>
  <script src="crypto-vault.js"></script>
  <script src="unlock.js"></script>
</body>
</html>
