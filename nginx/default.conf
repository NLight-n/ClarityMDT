map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # Health check (silent) - kept on HTTP to allow Docker health checks
    location = /nginx-health {
        access_log off;
        return 200 "ok";
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    # SSL certificates mapped from volume mount
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    set $app_upstream app:3000;

    # Let Next.js handle all security headers (CSP, COOP, COEP, etc.)
    # to avoid conflicts with its comprehensive header config.

    client_max_body_size 20g;
    client_body_timeout 3600s;
    send_timeout 3600s;

    # Next.js immutable static assets
    location /_next/static/ {
        proxy_pass http://$app_upstream;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Prevent caching for the Service Worker
    location = /sw.js {
        proxy_pass http://$app_upstream;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Prevent caching for the Web App Manifest (Next.js serves this at /manifest.webmanifest and rewrites /manifest.json)
    location ~* ^/(manifest\.webmanifest|manifest\.json)$ {
        proxy_pass http://$app_upstream;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location / {
        proxy_pass http://$app_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Block hidden/system files
    location ~ /\.(?!well-known) {
        deny all;
    }
}
